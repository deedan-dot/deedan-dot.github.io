<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daviscore Lente</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: white;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 2s ease-in-out;
}

/* OVERLAY */
.overlay {
    background: rgba(0,0,0,0.65);
    min-height: 100vh;
}

/* HEADER */
header {
    padding: 20px;
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    color: #00ff88;
}

/* CONTAINER */
.container {
    padding: 20px;
    max-width: 1100px;
    margin: auto;
}

/* MATCH */
.match {
    background: rgba(0,0,0,0.6);
    margin-bottom: 15px;
    padding: 15px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.score {
    font-size: 26px;
    font-weight: bold;
    color: #00ff88;
}

/* PLAYERS */
.players {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}

.player {
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
    padding: 10px;
    text-align: center;
}

.player img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
}

/* LINKS */
.links {
    text-align: center;
    margin-top: 30px;
}

.links a {
    background: #00ff88;
    color: black;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: 600;
    text-decoration: none;
    margin: 5px;
    display: inline-block;
}

/* FOOTER */
footer {
    margin-top: 40px;
    padding: 15px;
    text-align: center;
    font-size: 14px;
    background: rgba(0,0,0,0.7);
}

/* RESPONSIVE */
@media (max-width: 600px) {
    header {
        font-size: 24px;
    }
    .match {
        flex-direction: column;
        gap: 10px;
    }
}
</style>
</head>

<body>

<div class="overlay">

<header>
⚽ DAVISCORE LENTE ⚽
</header>

<div class="container">

<h2>📊 Live Scores</h2>

<div class="match">
    <div>PSG vs Real Madrid</div>
    <div class="score">3 - 2</div>
</div>

<div class="match">
    <div>Barcelona vs Man City</div>
    <div class="score">1 - 1</div>
</div>

<h2>🌟 Wachezaji Maarufu</h2>

<div class="players">
    <div class="player">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Kylian_Mbapp%C3%A9_2019.jpg">
        <p>Kylian Mbappé</p>
    </div>

    <div class="player">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg">
        <p>Cristiano Ronaldo</p>
    </div>

    <div class="player">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Lamine_Yamal_2023.jpg">
        <p>Lamine Yamal</p>
    </div>
</div>

<div class="links">
    <a href="#">🏠 Home</a>
    <a href="#">📅 Matches</a>
    <a href="#">📊 Standings</a>
    <a href="#">📞 Contact</a>
</div>

</div>

<footer>
👑 Mmiliki wa Website: <strong>Wewe</strong><br>
🛠️ Imetengenezwa na: <strong>Darniel Josee</strong>
</footer>

</div>

<script>
const images = [
 "https://upload.wikimedia.org/wikipedia/commons/a/a7/Kylian_Mbapp%C3%A9_2019.jpg",
 "https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg",
 "https://upload.wikimedia.org/wikipedia/commons/6/6e/Lamine_Yamal_2023.jpg",
 "https://upload.wikimedia.org/wikipedia/commons/c/c1/Lionel_Messi_20180626.jpg"
];

let index = 0;
setInterval(() => {
    document.body.style.backgroundImage = `url('${images[index]}')`;
    index = (index + 1) % images.length;
}, 5000);
</script>

</body>
</html>
