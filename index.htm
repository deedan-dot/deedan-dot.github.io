<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daviscore Interactive Table</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: white;
  background-size: cover;
  background-position: center;
  transition: background-image 1s ease-in-out;
}

.overlay {
  background: rgba(0,0,0,0.5);
  min-height: 100vh;
  padding-bottom: 50px;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 32px;
  font-weight: 700;
  color: #00ff88;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

table {
  width:100%;
  border-collapse: collapse;
  text-align: center;
  background: rgba(0,0,0,0.6);
  color:white;
  border-radius:12px;
  overflow:hidden;
  cursor: pointer;
}

thead {
  background:#00ff88;
  color:black;
}

thead th, tbody td {
  padding: 10px;
}

tbody tr:hover {
  background: rgba(0,255,136,0.3);
}

.player-section {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 20px;
  justify-content: center;
}

.player-section img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #00ff88;
}
</style>
</head>
<body>

<div class="overlay">

<header>
⚽ DAVISCORE INTERACTIVE ⚽
</header>

<div class="container">

<h2>🏆 Daviscore League Table</h2>

<table id="leagueTable">
  <thead>
    <tr>
      <th>#</th>
      <th>Timu</th>
      <th>Logo</th>
      <th>W</th>
      <th>D</th>
      <th>L</th>
      <th>GF</th>
      <th>GA</th>
      <th>Pts</th>
    </tr>
  </thead>
  <tbody>
    <tr data-team="Real Madrid">
      <td>1</td>
      <td>Real Madrid</td>
      <td><img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" width="40" height="40"></td>
      <td>10</td>
      <td>3</td>
      <td>2</td>
      <td>25</td>
      <td>12</td>
      <td class="score">33</td>
    </tr>
    <tr data-team="Barcelona">
      <td>2</td>
      <td>Barcelona</td>
      <td><img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg" width="40" height="40"></td>
      <td>9</td>
      <td>4</td>
      <td>2</td>
      <td>22</td>
      <td>10</td>
      <td class="score">31</td>
    </tr>
    <tr data-team="PSG">
      <td>3</td>
      <td>PSG</td>
      <td><img src="https://upload.wikimedia.org/wikipedia/en/3/3d/Paris_Saint-Germain_F.C..svg" width="40" height="40"></td>
      <td>5</td>
      <td>5</td>
      <td>5</td>
      <td>15</td>
      <td>15</td>
      <td class="score">20</td>
    </tr>
  </tbody>
</table>

<div class="player-section" id="playerSection">
  <!-- Picha za wachezaji zitaonekana hapa -->
</div>

</div>
</div>

<script>
// DATA YA TIMU
const teams = {
  "Real Madrid": {
    background: "https://upload.wikimedia.org/wikipedia/commons/5/56/Real_Madrid_CF.svg",
    players: [
      "https://upload.wikimedia.org/wikipedia/commons/9/9c/Cristiano_Ronaldo_2018.jpg",
      "https://upload.wikimedia.org/wikipedia/commons/6/6f/Karim_Benzema_2018.jpg"
    ]
  },
  "Barcelona": {
    background: "https://upload.wikimedia.org/wikipedia/commons/4/47/FC_Barcelona_%28crest%29.svg",
    players: [
      "https://upload.wikimedia.org/wikipedia/commons/c/c1/Lionel_Messi_20180626.jpg",
      "https://upload.wikimedia.org/wikipedia/commons/1/15/Neymar_2019.jpg"
    ]
  },
  "PSG": {
    background: "https://upload.wikimedia.org/wikipedia/commons/a/a7/Kylian_Mbapp%C3%A9_2019.jpg",
    players: [
      "https://upload.wikimedia.org/wikipedia/commons/a/a7/Kylian_Mbapp%C3%A9_2019.jpg",
      "https://upload.wikimedia.org/wikipedia/commons/3/3d/Paris_Saint-Germain_F.C..svg"
    ]
  }
};

// FUNCTION KUCHANGIA BACKGROUND NA PICTURE ZA PLAYERS
const table = document.getElementById("leagueTable");
const playerSection = document.getElementById("playerSection");

table.querySelectorAll("tbody tr").forEach(row => {
  row.addEventListener("click", () => {
    const teamName = row.dataset.team;
    const teamData = teams[teamName];

    // change background
    document.body.style.backgroundImage = `url('${teamData.background}')`;

    // show players
    playerSection.innerHTML = "";
    teamData.players.forEach(p => {
      const img = document.createElement("img");
      img.src = p;
      playerSection.appendChild(img);
    });
  });
});
</script>

</body>
</html>
