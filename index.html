<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daviscore Lente</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: white;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 1.5s ease-in-out;
}

/* OVERLAY ILI MAANDISHI YAONEKANE */
.overlay {
    background: rgba(0,0,0,0.6);
    min-height: 100vh;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    font-size: 32px;
    font-weight: 700;
    color: #00ff88;
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* MATCH */
.match {
    background: rgba(0,0,0,0.65);
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.score {
    font-size: 26px;
    font-weight: bold;
    color: #00ff88;
}

/* TEAM LOGOS */
.teams {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.team {
    background: rgba(0,0,0,0.65);
    border-radius: 15px;
    padding: 15px;
    text-align: center;
}

.team img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    background: white;
    border-radius: 50%;
    padding: 8px;
}

.team p {
    margin-top: 10px;
    font-weight: 600;
}

/* LINKS */
.links {
    text-align: center;
    margin-top: 30px;
}

.links a {
    background: #00ff88;
    color: black;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: 600;
    text-decoration: none;
    margin: 5px;
    display: inline-block;
}

/* FOOTER */
footer {
    margin-top: 40px;
    background: rgba(0,0,0,0.7);
    padding: 15px;
    text-align: center;
    font-size: 14px;
}

/* RESPONSIVE */
@media (max-width: 600px) {
    header {
        font-size: 24px;
    }
    .match {
        flex-direction: column;
        gap: 10px;
        text-align: center;
    }
}
</style>
</head>

<body>

<div class="overlay">

<header>
⚽ DAVISCORE LENTE ⚽
</header>

<div class="container">

<h2>📊 Live Scores</h2>

<div class="match">
    <div>PSG vs Real Madrid</div>
    <div class="score">2 - 2</div>
</div>

<div class="match">
    <div>Barcelona vs Man City</div>
    <div class="score">1 - 0</div>
</div>

<h2>🏆 Timu Kubwa Duniani</h2>

<div class="teams">
    <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg">
        <p>Real Madrid</p>
    </div>

    <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg">
        <p>Barcelona</p>
    </div>

    <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/9/9a/Manchester_United_FC_crest.svg">
        <p>Man United</p>
    </div>

    <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg">
        <p>Chelsea</p>
    </div>

    <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/0/05/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg">
        <p>Bayern Munich</p>
    </div>

    <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/3/3d/Paris_Saint-Germain_F.C..svg">
        <p>PSG</p>
    </div>
</div>

<div class="links">
    <a href="#">🏠 Home</a>
    <a href="#">📅 Matches</a>
    <a href="#">📊 Standings</a>
    <a href="#">📞 Contact</a>
</div>

</div>

<footer>
👑 Mmiliki wa Website: <strong>Wewe</strong><br>
🛠️ Imetengenezwa na: <strong>Darniel Josee</strong>
</footer>

</div>

<script>
const backgrounds = [
 "https://upload.wikimedia.org/wikipedia/commons/a/a7/Kylian_Mbapp%C3%A9_2019.jpg",
 "https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg",
 "https://upload.wikimedia.org/wikipedia/commons/c/c1/Lionel_Messi_20180626.jpg",
 "https://upload.wikimedia.org/wikipedia/commons/6/6e/Lamine_Yamal_2023.jpg"
];

let i = 0;
document.body.style.backgroundImage = `url('${backgrounds[0]}')`;

setInterval(() => {
    i = (i + 1) % backgrounds.length;
    document.body.style.backgroundImage = `url('${backgrounds[i]}')`;
}, 5000);
</script>

</body>
</html>
